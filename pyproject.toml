[project]
name = "testes-friovale"
version = "1.0.0"
description = "Suite de testes automatizados do sistema FrioVale (monitoramento da cadeia do frio)"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "coverage>=7.3.0",
    "faker>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que requerem o back-end Spring Boot rodando em http://localhost:8080",
    "unit: testes de unidade puros (nao requerem servidor)",
    "metrics: testes das metricas de qualidade de software",
]
addopts = "-v --tb=short --strict-markers"

[tool.black]
line-length = 100
target-version = ['py39']
